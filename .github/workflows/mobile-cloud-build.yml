name: Build Android APK and iOS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name shown on Play Store (e.g. 1.0.1 — leave blank for auto)'
        required: false
        default: ''
        type: string
      build_ios:
        description: 'Also build unsigned iOS IPA (uses GitHub macOS runner)'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install web & Capacitor plugin dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript types & build production web bundle
        env:
          VITE_ADMOB_ANDROID_INTERSTITIAL_ID: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          npm run lint
          npm run build

      - name: Install Capacitor CLI & Android platform
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/cli@6 \
            @capacitor/android@6

      - name: Generate Android project & inject Play Store SDK 35 + AdMob + Firebase
        id: android_config
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_TARGET_SDK: '35'
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          export ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          export ANDROID_VERSION_NAME="${INPUT_VERSION_NAME:-1.0.${GITHUB_RUN_NUMBER}}"
          echo "version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$ANDROID_VERSION_NAME" >> "$GITHUB_OUTPUT"
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/google-services.json
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ADMOB_ANDROID_APP_ID" ]; then
            echo "has_live_admob=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_live_admob=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/configure-native-admob.mjs android
          npx cap sync android
          REPORT_SHA1=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log((r.sha1List||[]).join(', '));" 2>/dev/null || true)
          REPORT_SHA1_COUNT=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.sha1Count || 0);" 2>/dev/null || echo "0")
          REPORT_WEB=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.hasWebClient ? 'true' : 'false');" 2>/dev/null || echo "false")
          REPORT_PKG=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.packageMatched ? 'true' : 'false');" 2>/dev/null || echo "false")
          REPORT_PROJECT=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.projectMatched ? 'true' : 'false');" 2>/dev/null || echo "false")
          REPORT_APP_ID=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.mobileSdkAppId || '');" 2>/dev/null || true)
          echo "gs_sha1=$REPORT_SHA1" >> "$GITHUB_OUTPUT"
          echo "gs_sha1_count=$REPORT_SHA1_COUNT" >> "$GITHUB_OUTPUT"
          echo "gs_web_client=$REPORT_WEB" >> "$GITHUB_OUTPUT"
          echo "gs_pkg_matched=$REPORT_PKG" >> "$GITHUB_OUTPUT"
          echo "gs_project_matched=$REPORT_PROJECT" >> "$GITHUB_OUTPUT"
          echo "gs_app_id=$REPORT_APP_ID" >> "$GITHUB_OUTPUT"

      - name: Build Android Debug APK & Signed Play Store AAB/Release APK
        id: signed_release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HAS_GOOGLE_SERVICES: ${{ steps.android_config.outputs.has_google_services }}
        run: |
          chmod +x gradlew
          trap 'rm -f app/release-keystore.jks' EXIT

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > app/release-keystore.jks
            SHA1=$(keytool -list -v -keystore app/release-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null | grep -m 1 "SHA1:" | awk '{print $2}' || true)
            SHA256=$(keytool -list -v -keystore app/release-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null | grep -m 1 "SHA256:" | awk '{print $2}' || true)
            echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
            echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

            # Sign BOTH debug & release with the same registered permanent keystore so app-debug.apk never causes Google Sign-In Error 10
            ./gradlew assembleDebug bundleRelease assembleRelease --no-daemon \
              -PludoStoreFile="$PWD/app/release-keystore.jks" \
              -PludoStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
              -PludoKeyAlias="$ANDROID_KEY_ALIAS" \
              -PludoKeyPassword="$ANDROID_KEY_PASSWORD" \
              -Pandroid.injected.signing.store.file="$PWD/app/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building debug APK only."
            ./gradlew assembleDebug --no-daemon
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

          # Verify google-services Gradle plugin generated R.string.default_web_client_id cleanly (not WILL_BE_OVERRIDDEN)
          GENERATED_WEB_CLIENT=""
          for f in app/build/generated/res/processReleaseGoogleServices/values/values.xml app/build/generated/res/processDebugGoogleServices/values/values.xml app/build/generated/res/google-services/release/values/values.xml app/build/generated/res/google-services/debug/values/values.xml; do
            if [ -f "$f" ]; then
              FOUND=$(grep -oE 'name="default_web_client_id"[^>]*>[^<]+' "$f" | sed 's/.*>//' | head -n 1 || true)
              if [ -n "$FOUND" ]; then
                GENERATED_WEB_CLIENT="$FOUND"
                break
              fi
            fi
          done
          if [ -n "$GENERATED_WEB_CLIENT" ] && echo "$GENERATED_WEB_CLIENT" | grep -q '\.apps\.googleusercontent\.com'; then
            echo "web_client_verified=true" >> "$GITHUB_OUTPUT"
            echo "Verified generated default_web_client_id in Gradle resources."
          else
            echo "web_client_verified=false" >> "$GITHUB_OUTPUT"
            if [ "$HAS_GOOGLE_SERVICES" = "true" ]; then
              echo "::error::google-services Gradle plugin did NOT generate a valid default_web_client_id! Check GOOGLE_SERVICES_JSON_BASE64."
              exit 1
            fi
          fi

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Play Store AAB & Release APK
        if: steps.signed_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-PlayStore-Signed-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Android Build & Play Store Readiness Summary
        run: |
          KEY_SHA1="${{ steps.signed_release.outputs.sha1 }}"
          KEY_SHA256="${{ steps.signed_release.outputs.sha256 }}"
          GS_SHA1="${{ steps.android_config.outputs.gs_sha1 }}"
          GS_SHA1_COUNT="${{ steps.android_config.outputs.gs_sha1_count }}"
          WEB_VERIFIED="${{ steps.signed_release.outputs.web_client_verified }}"

          if [ "${{ steps.signed_release.outputs.built }}" = "true" ] && [ -n "$KEY_SHA1" ]; then
            if ! echo "$GS_SHA1" | grep -qi "$KEY_SHA1"; then
              echo "::warning::Upload Keystore SHA-1 ($KEY_SHA1) is NOT in google-services.json! Add it in Firebase Console -> com.ludocrown.game, re-download google-services.json, and update GOOGLE_SERVICES_JSON_BASE64."
            fi
            if [ "${GS_SHA1_COUNT:-0}" -lt 2 ]; then
              echo "::warning::google-services.json has fewer than 2 SHA-1 fingerprints. For Google Play Store (.aab) installs, also add the Play App Signing SHA-1 from Play Console -> Setup -> App integrity -> App signing key certificate."
            fi
          fi

          {
            echo "## Ludo Crown — Android & Play Store Build Summary"
            echo ""
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Play Store Target SDK | Ready (API 35) | \`targetSdkVersion = 35\` (Android 15), \`versionCode = ${{ steps.android_config.outputs.version_code }}\`, \`versionName = ${{ steps.android_config.outputs.version_name }}\` |"
            echo "| App Launcher Icon | Ready | Ludo Crown icon installed across Android mipmap densities |"
            if [ "${{ steps.android_config.outputs.has_live_admob }}" = "true" ]; then
              echo "| Google AdMob Ads | Live | Live App ID + Live Top Adaptive Banner + Live Rewarded Video + Live Post-Match Interstitial wired |"
            else
              echo "| Google AdMob Ads | Test Mode | Add \`ADMOB_ANDROID_APP_ID\` secret before Play Store release |"
            fi
            if [ "${{ steps.android_config.outputs.has_google_services }}" = "true" ]; then
              echo "| Native Google Sign-In | Enabled (+ Web Fallback) | Project matched=${{ steps.android_config.outputs.gs_project_matched }}, Package matched=${{ steps.android_config.outputs.gs_pkg_matched }}, Gradle Web OAuth verified=${WEB_VERIFIED} |"
              echo "| Firebase / Google Analytics | Enabled | Native SDK bundled via \`@capacitor-firebase/analytics\` · Firebase App ID \`${{ steps.android_config.outputs.gs_app_id }}\` |"
            else
              echo "| Native Google Sign-In | Missing | Add \`GOOGLE_SERVICES_JSON_BASE64\` secret to enable Sign-In / Online Play |"
              echo "| Firebase / Google Analytics | Missing | Add \`GOOGLE_SERVICES_JSON_BASE64\` secret so Android Analytics connects to GA4 |"
            fi
            if [ "${{ steps.signed_release.outputs.built }}" = "true" ]; then
              echo "| Play Store Bundle & APK | Signed (Debug + Release) | Download \`LudoCrown-PlayStore-Signed-Release\`: upload \`app-release.aab\` to Play Console & test \`app-release.apk\` on phone |"
              if [ -n "$KEY_SHA1" ]; then
                echo ""
                echo "### Google Sign-In & Play Store App Signing Fingerprints"
                echo "- **Upload Keystore SHA-1**: \`$KEY_SHA1\`"
                if [ -n "$KEY_SHA256" ]; then
                  echo "- **Upload Keystore SHA-256 (for \`public/.well-known/assetlinks.json\` & Firebase)**: \`$KEY_SHA256\`"
                fi
                echo "- **SHA-1(s) registered in \`google-services.json\` ($GS_SHA1_COUNT total)**: \`${GS_SHA1:-NONE FOUND}\`"
                if echo "$GS_SHA1" | grep -qi "$KEY_SHA1"; then
                  echo "- **Upload Key Check**: MATCHED — Direct \`app-release.apk\` & \`app-debug.apk\` installs match Firebase!"
                else
                  echo "- **Upload Key Check**: MISMATCH — Add \`$KEY_SHA1\` in Firebase Console -> Android app \`com.ludocrown.game\`, re-download \`google-services.json\`, and update \`GOOGLE_SERVICES_JSON_BASE64\`."
                fi
                if [ "${GS_SHA1_COUNT:-0}" -lt 2 ]; then
                  echo "- **Play Store (.aab) Notice**: Google Play re-signs \`.aab\` bundles with its own **App Signing key**. To prevent Error 10 on Play Store installs, add BOTH your Upload SHA-1 AND your Play Console **App signing key certificate SHA-1** (**Play Console → Setup → App integrity → App signing**) to Firebase Console → \`com.ludocrown.game\`, then re-download \`google-services.json\` and update \`GOOGLE_SERVICES_JSON_BASE64\`."
                else
                  echo "- **Play Store (.aab) Check**: Multiple SHA-1s detected ($GS_SHA1_COUNT) — verify both Upload Key & Play App Signing SHA-1 are included above."
                fi
              fi
            else
              echo "| Play Store Bundle & APK | Debug Only | Add \`ANDROID_KEYSTORE_BASE64\` secrets to build signed \`.aab\` & \`.apk\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build iOS App (macOS Cloud Runner)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios == true
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web & Capacitor plugin dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Install Capacitor CLI & iOS platform
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/cli@6 \
            @capacitor/ios@6

      - name: Generate iOS project & inject AdMob / Firebase config
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          npx cap add ios
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | tr -d '\n\r ' | base64 --decode > ios/App/App/GoogleService-Info.plist
          fi
          node scripts/configure-native-admob.mjs ios
          npx cap sync ios

      - name: Compile unsigned iOS Release app bundle
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r LudoCrown-iOS-Unsigned.ipa Payload

      - name: Upload iOS Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-iOS-Unsigned-IPA
          path: ios/App/LudoCrown-iOS-Unsigned.ipa
          if-no-files-found: error
