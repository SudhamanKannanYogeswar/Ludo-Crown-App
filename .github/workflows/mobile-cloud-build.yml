name: Build Android APK and iOS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name shown on Play Store (e.g. 1.0.1 — leave blank for auto)'
        required: false
        default: ''
        type: string
      build_ios:
        description: 'Also build unsigned iOS IPA (uses GitHub macOS runner)'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install web & Capacitor plugin dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript types & build production web bundle
        env:
          VITE_ADMOB_ANDROID_INTERSTITIAL_ID: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
        run: |
          npm run lint
          npm run build

      - name: Install Capacitor CLI & Android platform
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/cli@6 \
            @capacitor/android@6

      - name: Generate Android project & inject Play Store SDK 35 + AdMob + Firebase
        id: android_config
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_TARGET_SDK: '35'
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          export ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          export ANDROID_VERSION_NAME="${INPUT_VERSION_NAME:-1.0.${GITHUB_RUN_NUMBER}}"
          echo "version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$ANDROID_VERSION_NAME" >> "$GITHUB_OUTPUT"
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/google-services.json
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ADMOB_ANDROID_APP_ID" ]; then
            echo "has_live_admob=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_live_admob=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/configure-native-admob.mjs android
          npx cap sync android
          REPORT_SHA1=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log((r.sha1List||[]).join(', '));" 2>/dev/null || true)
          REPORT_WEB=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.hasWebClient ? 'true' : 'false');" 2>/dev/null || echo "false")
          REPORT_PKG=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.packageMatched ? 'true' : 'false');" 2>/dev/null || echo "false")
          echo "gs_sha1=$REPORT_SHA1" >> "$GITHUB_OUTPUT"
          echo "gs_web_client=$REPORT_WEB" >> "$GITHUB_OUTPUT"
          echo "gs_pkg_matched=$REPORT_PKG" >> "$GITHUB_OUTPUT"

      - name: Build installable Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Play Store AAB & Release APK (if keystore secrets exist)
        id: signed_release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — skipping signed Play Store bundle."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > app/release-keystore.jks
          SHA1=$(keytool -list -v -keystore app/release-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null | grep -m 1 "SHA1:" | awk '{print $2}' || true)
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f app/release-keystore.jks
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Play Store AAB & Release APK
        if: steps.signed_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-PlayStore-Signed-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Android Build & Play Store Readiness Summary
        run: |
          KEY_SHA1="${{ steps.signed_release.outputs.sha1 }}"
          GS_SHA1="${{ steps.android_config.outputs.gs_sha1 }}"
          {
            echo "## Ludo Crown — Android & Play Store Build Summary"
            echo ""
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Play Store Target SDK | Ready (API 35) | \`targetSdkVersion = 35\` (Android 15), \`versionCode = ${{ steps.android_config.outputs.version_code }}\`, \`versionName = ${{ steps.android_config.outputs.version_name }}\` |"
            echo "| App Launcher Icon | Ready | Ludo Crown icon installed across Android mipmap densities |"
            if [ "${{ steps.android_config.outputs.has_live_admob }}" = "true" ]; then
              echo "| Google AdMob Ads | Live | Live App ID + Live Banner + Live Rewarded Video wired (test interstitial auto-disabled) |"
            else
              echo "| Google AdMob Ads | Test Mode | Add \`ADMOB_ANDROID_APP_ID\` secret before Play Store release |"
            fi
            if [ "${{ steps.android_config.outputs.has_google_services }}" = "true" ]; then
              echo "| Native Google Sign-In | Enabled | Package matched=${{ steps.android_config.outputs.gs_pkg_matched }}, Web OAuth=${{ steps.android_config.outputs.gs_web_client }} |"
            else
              echo "| Native Google Sign-In | Missing | Add \`GOOGLE_SERVICES_JSON_BASE64\` secret to enable Sign-In / Online Play |"
            fi
            if [ "${{ steps.signed_release.outputs.built }}" = "true" ]; then
              echo "| Play Store Bundle & APK | Signed | Download \`LudoCrown-PlayStore-Signed-Release\`: upload \`app-release.aab\` to Play Console & test \`app-release.apk\` on phone |"
              if [ -n "$KEY_SHA1" ]; then
                echo ""
                echo "### Google Sign-In SHA-1 Match Check"
                echo "- **APK Keystore SHA-1**: \`$KEY_SHA1\`"
                echo "- **SHA-1(s) in \`google-services.json\`**: \`${GS_SHA1:-NONE FOUND}\`"
                if echo "$GS_SHA1" | grep -qi "$KEY_SHA1"; then
                  echo "- **Result**: MATCHED — Native Google Sign-In is ready for direct APK installs! *(Once uploaded to Play Console, also add Google Play App Signing SHA-1 in Firebase Console.)*"
                else
                  echo "- **Result**: MISMATCH — Paste \`$KEY_SHA1\` in Firebase Console -> Android app \`com.ludocrown.game\`, re-download \`google-services.json\`, and update \`GOOGLE_SERVICES_JSON_BASE64\` secret."
                fi
              fi
            else
              echo "| Play Store Bundle & APK | Debug Only | Add \`ANDROID_KEYSTORE_BASE64\` secrets to build signed \`.aab\` & \`.apk\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build iOS App (macOS Cloud Runner)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios == true
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web & Capacitor plugin dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Install Capacitor CLI & iOS platform
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/cli@6 \
            @capacitor/ios@6

      - name: Generate iOS project & inject AdMob / Firebase config
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          npx cap add ios
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | tr -d '\n\r ' | base64 --decode > ios/App/App/GoogleService-Info.plist
          fi
          node scripts/configure-native-admob.mjs ios
          npx cap sync ios

      - name: Compile unsigned iOS Release app bundle
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r LudoCrown-iOS-Unsigned.ipa Payload

      - name: Upload iOS Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-iOS-Unsigned-IPA
          path: ios/App/LudoCrown-iOS-Unsigned.ipa
          if-no-files-found: error
