name: Build Android APK and iOS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also build unsigned iOS IPA (uses GitHub macOS runner)'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install web & Capacitor plugin dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Install Capacitor CLI & Android platform
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/cli@6 \
            @capacitor/android@6

      - name: Generate Android project & inject AdMob + Firebase config
        id: android_config
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/google-services.json
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ADMOB_ANDROID_APP_ID" ]; then
            echo "has_live_admob=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_live_admob=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/configure-native-admob.mjs android
          npx cap sync android
          REPORT_SHA1=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log((r.sha1List||[]).join(', '));" 2>/dev/null || true)
          REPORT_WEB=$(node -e "const r=JSON.parse(require('fs').readFileSync('android/.native-config-report.json','utf8')); console.log(r.hasWebClient ? 'true' : 'false');" 2>/dev/null || echo "false")
          echo "gs_sha1=$REPORT_SHA1" >> "$GITHUB_OUTPUT"
          echo "gs_web_client=$REPORT_WEB" >> "$GITHUB_OUTPUT"

      - name: Build installable Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Play Store AAB & Release APK (if keystore secrets exist)
        id: signed_release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — skipping signed Play Store bundle."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > app/release-keystore.jks
          SHA1=$(keytool -list -v -keystore app/release-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null | grep -m 1 "SHA1:" | awk '{print $2}' || true)
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f app/release-keystore.jks
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Play Store AAB & APK
        if: steps.signed_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-PlayStore-Signed-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Android Build & Firebase Sign-In Summary
        run: |
          {
            echo "## Ludo Crown Android Build Summary"
            echo ""
            echo "| Feature | Status | Details |"
            echo "| --- | --- | --- |"
            if [ "${{ steps.android_config.outputs.has_live_admob }}" = "true" ]; then
              echo "| Google AdMob App ID | Live | Injected from \`ADMOB_ANDROID_APP_ID\` + native AdMob plugin wired |"
            else
              echo "| Google AdMob App ID | Test Mode | Add \`ADMOB_ANDROID_APP_ID\` secret for live ads |"
            fi
            if [ "${{ steps.android_config.outputs.has_google_services }}" = "true" ]; then
              echo "| Native Google Sign-In | Enabled | \`rgcfaIncludeGoogle=true\`, \`google-services.json\` injected, Web OAuth=${{ steps.android_config.outputs.gs_web_client }} |"
            else
              echo "| Native Google Sign-In | Missing | Add \`GOOGLE_SERVICES_JSON_BASE64\` secret to enable Sign-In / Online Play |"
            fi
            if [ "${{ steps.signed_release.outputs.built }}" = "true" ]; then
              echo "| Permanent Signing Keystore | Signed | Install \`app-release.apk\` from \`LudoCrown-PlayStore-Signed-Release\` |"
              if [ -n "${{ steps.signed_release.outputs.sha1 }}" ]; then
                echo ""
                echo "### Signing SHA-1 Verification"
                echo "- **APK Keystore SHA-1**: \`${{ steps.signed_release.outputs.sha1 }}\`"
                echo "- **SHA-1(s) inside \`google-services.json\`**: \`${{ steps.android_config.outputs.gs_sha1 || 'NONE FOUND — re-download google-services.json after adding SHA-1!' }}\`"
              fi
            else
              echo "| Permanent Signing Keystore | Temporary Debug Key | Add \`ANDROID_KEYSTORE_BASE64\` secrets so SHA-1 stays fixed for Google Sign-In |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build iOS App (macOS Cloud Runner)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios == true
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web & Capacitor plugin dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Install Capacitor CLI & iOS platform
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/cli@6 \
            @capacitor/ios@6

      - name: Generate iOS project & inject AdMob / Firebase config
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          npx cap add ios
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | tr -d '\n\r ' | base64 --decode > ios/App/App/GoogleService-Info.plist
          fi
          node scripts/configure-native-admob.mjs ios
          npx cap sync ios

      - name: Compile unsigned iOS Release app bundle
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r LudoCrown-iOS-Unsigned.ipa Payload

      - name: Upload iOS Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoCrown-iOS-Unsigned-IPA
          path: ios/App/LudoCrown-iOS-Unsigned.ipa
          if-no-files-found: error
